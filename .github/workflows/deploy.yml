name: Deploy to GitHub Pages

# Builds the Vite site and publishes it via GitHub Pages on every push to
# main. Uses the official actions/deploy-pages flow (not the gh-pages
# branch/package) - no extra npm package or personal token needed, just the
# repo's own built-in GITHUB_TOKEN.
#
# One-time setup after this file lands on GitHub: repo Settings -> Pages ->
# "Build and deployment" -> Source -> "GitHub Actions". Without that switch
# flipped, this workflow will build successfully but Pages won't actually
# serve the result.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
